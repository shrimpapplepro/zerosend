[package]
name = "zerosend-daemon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Headless LocalSend peer for the ZeroSend CardputerZero app, driven over JSON lines on stdin/stdout"

[[bin]]
name = "zerosend-daemon"
path = "src/main.rs"

[dependencies]
# LocalSend's own protocol core (packages/core upstream): discovery, the HTTPS
# server, the pinned mTLS client. Used unmodified, pinned to one upstream commit;
# bump `rev` to take upstream changes.
localsend = { git = "https://github.com/localsend/localsend", rev = "92e133aa43869e94d394fd04fa70c50a0f796a64", features = ["crypto", "discovery", "http", "multicast"] }
anyhow = "1.0"
bytes = "1.11"
dirs = "6.0"
futures-util = "0.3"
gethostname = "1.0"
mime_guess = "2.0"
pem = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"

# Its own workspace, so cargo doesn't look for one above daemon/.
[workspace]

[profile.release]
# The device is a Pi Zero 2 W: a smaller binary loads faster from the SD card.
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
