[package]
name = "zerosend-daemon"
version = "0.1.0"
edition = "2024"
license = "Apache-2.0"
description = "Headless LocalSend peer for the ZeroSend CardputerZero app, driven over JSON lines on stdin/stdout"

[[bin]]
name = "zerosend-daemon"
path = "src/main.rs"

[dependencies]
# LocalSend's own protocol core from this repository: discovery, the HTTPS
# server, the pinned mTLS client. Used unmodified.
localsend = { path = "../../packages/core", features = ["crypto", "discovery", "http", "multicast"] }
anyhow = "1.0"
bytes = "1.11"
dirs = "6.0"
futures-util = "0.3"
gethostname = "1.0"
mime_guess = "2.0"
pem = "4.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1", features = ["full"] }
tokio-util = { version = "0.7", features = ["rt"] }
uuid = { version = "1", features = ["v4"] }
walkdir = "2.5"

# Its own workspace, not a member of the repository's: the root workspace is
# LocalSend's, and this keeps the fork's diff to the upstream files at zero.
[workspace]

[profile.release]
# The device is a Pi Zero 2 W: a smaller binary loads faster from the SD card.
opt-level = 3
lto = "thin"
codegen-units = 4
strip = true
panic = "abort"
